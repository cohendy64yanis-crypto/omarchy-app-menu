<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app-container">
    <div id="menus-wrapper"></div>
    <button id="btn-main-add" class="btn-add-menu">+ Add the app</button>
  </div>

  <!-- Modal de création / modification de menu -->
  <div id="modal-select" class="modal hidden">
    <div class="modal-content">
      <h3>Configurer le menu</h3>
      <input type="text" id="menu-name-input" placeholder="Nom du menu (ex: Jeux, Dev...)" />
      
      <div id="apps-list-container" class="apps-list">
        <!-- Chargé dynamiquement via app.js -->
      </div>

      <div class="modal-actions">
        <button id="btn-cancel">Annuler</button>
        <button id="btn-save">Enregistrer</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
